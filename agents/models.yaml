# The one model and effort every iVouch agent runs on (orchestrator and builders).
# Muse Code sub-agents inherit the session's model, so there are no per-brief models or tiers.
# Model IDs are public names, not secrets. API keys go in .env (ignored by git), never here.
# Changing anything in this file is a user decision; log the date of any change.

model_id: muse-spark-1.3
# The ID Muse Code reports at runtime in Contributor mode (user decision, 2026-10-27).
# Logs and commits record this runtime ID.
runtime_model_id: muse-spark-1.3-contributor
effort: high

# Muse Code does not queue sub-agents; the orchestrator enforces this limit itself.
max_concurrent_builders: 3
