# Meta model tiers used by the orchestrator and builders.
# Fill in exact model IDs before `start phase 0`. The orchestrator stops if a needed tier is TBD.
# Changing a mapping is a user decision; log the date of any change.

tiers:
  small:
    model_id: muse-spark-1.1
    use_for: "fixtures, docs, registries, label maps"
  medium:
    model_id: muse-spark-1.2
    use_for: "default; Phase 0/1/4/6/7/8 code, endpoints, screens, web pages"
  large:
    model_id: muse-spark-1.3
    use_for: "Phase 2 heads, Phase 3 segmenter bake-off, Phase 5 fusion/forensics, Phase 9 red-team/load, cross-phase fixes"

orchestrator:
  model_id: muse-spark-1.3

efforts: [low, medium, high, max]
