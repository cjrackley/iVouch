<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - iVouch Lite</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone-shell">
<header class="top-bar">
<span class="top-bar-title">iVouch Lite</span>
<a class="btn btn-secondary" href="/login">Log in</a>
<a class="btn btn-primary" href="/signup">Sign up</a>
<a class="btn btn-tertiary" href="/logout">Log out</a>
<a class="btn btn-tertiary top-bar-gear" href="/account" aria-label="Account settings">&#9881;</a>
</header>
<div class="shell-body">
<nav class="sidebar" aria-label="Primary">
<a class="tab-item" href="/map">Map</a>
<a class="tab-item tab-create" href="/upload">Create</a>
<a class="tab-item" href="/account">Profile</a>
</nav>
<main class="safe-area">
{% block content %}{% endblock %}
</main>
</div>
<nav class="tab-bar" aria-label="Primary">
<a class="tab-item" href="/map">Map</a>
<a class="tab-item tab-create" href="/upload">Create</a>
<a class="tab-item" href="/account">Profile</a>
</nav>
<footer class="shell-footer">
<p>iVouch Lite demo build.</p>
</footer>
</div>
</body>
</html>
