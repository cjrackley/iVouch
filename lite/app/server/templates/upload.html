{% extends "base.html" %}
{% block content %}
<h1>Upload</h1>
{% if verified %}
<p>The upload form is not part of this page yet. It arrives with the
next update.</p>
{% else %}
<p>Please verify your email to enable uploads. Uploads are disabled
until your email address is verified.</p>
<form method="post" action="/verify-resend">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button type="submit">Send a new verification email</button>
</form>
{% endif %}
{% endblock %}
