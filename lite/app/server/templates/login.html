{% extends "base.html" %}
{% block content %}
<style>
.auth-wrap {
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
.auth-logo {
  font-size: 32px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--color-text);
  text-align: center;
  margin: 24px 0 8px;
}
.auth-title {
  text-align: center;
}
.auth-form {
  text-align: center;
}
.auth-form label {
  text-align: center;
}
.auth-wrap input {
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}
.auth-wrap .error {
  text-align: center;
}
.auth-submit {
  width: 100%;
  min-height: 48px;
}
.auth-switch {
  text-align: center;
  color: var(--color-text-secondary);
}
@media (min-width: 768px) {
  .auth-wrap {
    max-width: 430px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
  }
}
</style>
<div class="auth-wrap">
<p class="auth-logo">iVouch</p>
<h1 class="auth-title">Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="auth-form" method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email address
<input type="email" name="email" required autocomplete="email">
</label>
<label>Password
<input type="password" name="password" required autocomplete="current-password">
</label>
<button class="btn btn-primary auth-submit" type="submit">Log in</button>
</form>
<p class="auth-switch">No account yet? <a class="btn btn-tertiary" href="/signup">Create one</a>.</p>
</div>
{% endblock %}
