{% extends "base.html" %}
{% block content %}
<h1>Verify email</h1>
{% if message %}<p class="info">{{ message }}</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if message %}
<p><a class="btn btn-primary" href="/login">Log in</a></p>
{% else %}
<p>Paste the token from your verification email below.</p>
<form method="get" action="/verify">
<label>Token
<input type="text" name="token" required>
</label>
<button type="submit">Verify</button>
</form>
{% endif %}
{% endblock %}
