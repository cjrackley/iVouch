# Lite dispatch defaults. Inheritance only; no per-builder models.
# Changing anything here is a user decision (orchestrator section 5).

dispatch:
  default: native            # muse.subagent_spawn; inherits session model
  max_concurrent_builders: 1 # one shared tree; serial briefs only

session:
  model_id: null             # unobserved; recorded as "unobserved" in logs
  effort: null

# Lite never uses workflow dispatch tiers. All builders inherit.
tiers_verified: false
builders:
  tests:     { model: null, effort: null }
  implement: { model: null, effort: null }

budget:
  total_usd_cap: 200         # agent/API tokens for all Lite work
  agent_soft_cap_usd: 140    # freeze features beyond this; tests/docs only
  external_api_usd: 0        # local-only; paid calls need a user decision

# Change log (user decisions only):
# - Lite created: native inherit dispatch, $200 cap, $0 external APIs.
